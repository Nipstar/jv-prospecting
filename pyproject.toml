[project]
name = "prospector"
version = "0.1.0"
description = "Local business prospecting pipeline for Antek Automation — finds and qualifies high-ticket UK businesses as outreach targets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "questionary>=2.0",
    "click>=8.1",
    "rich>=13.7",
]

[project.scripts]
prospector = "prospector.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prospector"]
